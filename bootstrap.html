<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Steam Unlock ONENNABE - System Boot</title>
  <!-- Steam client font (Motiva Sans), loaded from Steam's own CDN. See license note. -->
  <link rel="stylesheet" href="https://community.akamai.steamstatic.com/public/shared/css/motiva_sans.css?l=english">
  <style>
    :root {
      --steam-bg:        #1b2838;
      --steam-bg-dark:   #171a21;
      --steam-panel:     #2a475e;
      --steam-blue:      #66c0f4;
      --steam-blue-lit:  #1a9fff;
      --steam-text:      #c7d5e0;
      --steam-text-dim:  #8f98a0;
      --error-red:       #e05a5a;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: "Motiva Sans", Sans-Serif;
      background: var(--steam-bg-dark);
      color: var(--steam-text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* --- Steam dark ambient background --- */
    .atmo-layer {
      position: fixed;
      inset: 0;
      z-index: -1;
      background:
        radial-gradient(ellipse 120% 80% at 50% -12%, #2a475e 0%, rgba(42,71,94,0) 55%),
        linear-gradient(180deg, #1b2838 0%, #171a21 100%);
    }
    .atmo-glow {
      position: absolute;
      width: 70vw;
      height: 70vw;
      border-radius: 50%;
      filter: blur(90px);
      opacity: 0.12;
      background: #1a9fff;
      top: -25%;
      left: 50%;
      transform: translateX(-50%);
      animation: pulse 6s ease-in-out infinite alternate;
    }
    @keyframes pulse {
      from { opacity: 0.08; transform: translateX(-50%) scale(1); }
      to   { opacity: 0.16; transform: translateX(-50%) scale(1.12); }
    }

    /* --- Steam-style panel --- */
    .loader-container {
      position: relative;
      width: 420px;
      padding: 48px 40px 40px;
      background: rgba(23, 29, 38, 0.72);
      border: 1px solid rgba(102, 192, 244, 0.12);
      border-radius: 8px;
      text-align: center;
      box-shadow: 0 24px 60px rgba(0,0,0,0.55), inset 0 1px 0 rgba(255,255,255,0.03);
      z-index: 10;
      transition: opacity 0.8s ease, transform 0.8s ease;
    }
    .loader-container.fade-out {
      opacity: 0;
      transform: scale(0.98) translateY(12px);
    }

    /* --- Steam "connecting" spinner around SU monogram --- */
    .logo-viewport {
      position: relative;
      width: 118px;
      height: 118px;
      margin: 0 auto 34px;
    }
    .spinner-ring {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 3px solid rgba(102, 192, 244, 0.10);
      border-top-color: var(--steam-blue);
      border-right-color: var(--steam-blue);
      box-shadow: 0 0 26px rgba(102, 192, 244, 0.25);
      animation: spin 1.1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .logo-core {
      position: absolute;
      inset: 14px;
      border-radius: 50%;
      background: radial-gradient(circle at 50% 32%, #1b2838, #0c1015);
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(102, 192, 244, 0.15);
      box-shadow: inset 0 2px 14px rgba(0,0,0,0.6);
      z-index: 2;
    }
    .logo-core img {
      width: 60%;
      height: 60%;
      object-fit: contain;
      filter: drop-shadow(0 0 10px rgba(102, 192, 244, 0.35));
    }

    /* --- Typography --- */
    h1 {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 5px;
      text-transform: uppercase;
      color: #ffffff;
      margin-bottom: 6px;
    }
    .subtitle {
      font-size: 11px;
      color: var(--steam-blue);
      text-transform: uppercase;
      letter-spacing: 7px;
      font-weight: 500;
      margin-bottom: 34px;
    }

    .status-area {
      min-height: 18px;
      margin-bottom: 18px;
    }
    .status-text {
      font-size: 12px;
      color: var(--steam-text-dim);
      font-weight: 400;
      letter-spacing: 0.4px;
      transition: opacity 0.3s;
    }

    /* --- Steam-style progress bar --- */
    .progress-track {
      width: 100%;
      height: 4px;
      background: rgba(0,0,0,0.45);
      border: 1px solid rgba(255,255,255,0.04);
      border-radius: 2px;
      overflow: hidden;
      margin-bottom: 10px;
    }
    .progress-fill {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, var(--steam-blue-lit), var(--steam-blue));
      box-shadow: 0 0 12px rgba(102, 192, 244, 0.6);
      transition: width 0.4s cubic-bezier(0.1, 0.7, 1.0, 0.1);
    }

    /* --- Error UI --- */
    .error-ui {
      display: none;
      animation: fadeIn 0.4s ease;
    }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    .error-msg {
      color: var(--error-red);
      font-size: 12px;
      margin-bottom: 15px;
    }

    .retry-btn {
      background: linear-gradient(180deg, #3d6c8d, #2a475e);
      border: 1px solid rgba(102, 192, 244, 0.22);
      color: var(--steam-text);
      padding: 10px 24px;
      border-radius: 3px;
      cursor: pointer;
      text-transform: uppercase;
      font-size: 10px;
      letter-spacing: 2px;
      transition: all 0.2s;
    }
    .retry-btn:hover {
      background: linear-gradient(180deg, #66c0f4, #417a9b);
      border-color: var(--steam-blue);
      color: #ffffff;
    }
  </style>
</head>

    <h1>Steam Unlock</h1>
    <div class="subtitle">Onennabe</div>

    <div class="status-area">
      <div class="status-text" id="status">Initializing...</div>
    </div>

    <div id="progress-container">
      <div class="progress-track">
        <div class="progress-fill" id="progress-bar"></div>
      </div>
    </div>

    <div class="error-ui" id="error-ui">
      <p class="error-msg" id="error-msg">System link failure.</p>
      <button class="retry-btn" onclick="location.reload()">Off VPN/WARP and Retry</button>
    </div>
  </div>

  <script>
    /**
     * Logic configuration
     */
    const BOOT_CONFIG = {
      minDisplayTime: 4000,
      steps: [
        { p: 20, m: 'Initializing system kernels...' },
        { p: 45, m: 'Establishing secure link...' },
        { p: 70, m: 'Fetching application data...' },
        { p: 90, m: 'Processing interface...' },
        { p: 100, m: 'System Ready' }
      ]
    };

    class AppBootstrap {
      constructor() {
        this.statusEl = document.getElementById('status');
        this.progressBar = document.getElementById('progress-bar');
        this.container = document.getElementById('boot-container');
        this.errorUI = document.getElementById('error-ui');
        this.progContainer = document.getElementById('progress-container');
        this.startTime = Date.now();
        this.downloadedContent = null;
      }

      updateStatus(message) {
        this.statusEl.style.opacity = 0;
        setTimeout(() => {
          this.statusEl.textContent = message;
          this.statusEl.style.opacity = 1;
        }, 200);
      }

      updateProgress(percent) {
        this.progressBar.style.width = percent + '%';
      }

      showError(msg) {
        this.statusEl.style.display = 'none';
        this.progContainer.style.display = 'none';
        this.errorUI.style.display = 'block';
        document.getElementById('error-msg').textContent = msg;
      }

      /**
       * Original Fetch Logic
       */
      async fetchApp() {
        try {
          // Replace with your actual endpoint
          const response = await fetch('/api/bootstrap/index.html');
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          this.downloadedContent = await response.text();
        } catch (e) {
          throw new Error('Could not connect to update server.');
        }
      }

      async runSequence() {
        try {
          // Start download and animation in parallel
          const downloadPromise = this.fetchApp();

          for (const step of BOOT_CONFIG.steps) {
            this.updateStatus(step.m);
            this.updateProgress(step.p);
            await this.sleep(800);
          }

          await downloadPromise;

          // Ensure minimum time for visual polish
          const elapsed = Date.now() - this.startTime;
          if (elapsed < BOOT_CONFIG.minDisplayTime) {
            await this.sleep(BOOT_CONFIG.minDisplayTime - elapsed);
          }

          this.complete();
        } catch (error) {
          this.showError(error.message);
        }
      }

      sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

      complete() {
        this.container.classList.add('fade-out');
        setTimeout(() => {
          if (this.downloadedContent) {
            document.open();
            document.write(this.downloadedContent);
            document.close();
          } else {
            console.log("Bootstrap complete. Content would inject here.");
          }
        }, 800);
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      // Small delay before starting boot sequence
      setTimeout(() => new AppBootstrap().runSequence(), 500);
    });
  </script>
